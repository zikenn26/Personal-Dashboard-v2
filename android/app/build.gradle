apply plugin: 'com.android.application'

android {
    namespace = "com.zikenn.dashboard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zikenn.dashboard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (file('release-key.jks').exists()) {
                storeFile file('release-key.jks')
                storePassword 'zikenn12345'
                keyAlias 'zikenn-key'
                keyPassword 'zikenn12345'
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
        release {
            if (file('release-key.jks').exists()) {
                storeFile file('release-key.jks')
                def sPassword = System.getenv('RELEASE_KEYSTORE_PASSWORD') ?: (project.findProperty('RELEASE_KEYSTORE_PASSWORD') ?: 'zikenn12345')
                def kAlias = System.getenv('RELEASE_KEY_ALIAS') ?: (project.findProperty('RELEASE_KEY_ALIAS') ?: 'zikenn-key')
                def kPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: (project.findProperty('RELEASE_KEY_PASSWORD') ?: 'zikenn12345')
                storePassword sPassword
                keyAlias kAlias
                keyPassword kPassword
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                initWith(signingConfigs.debug)
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.activity:activity:$rootProject.ext.androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.length() > 0) {
    try {
        apply plugin: 'com.google.gms.google-services'
    } catch(Exception e) {
        logger.info("google-services plugin could not be applied: " + e.message)
    }
}
